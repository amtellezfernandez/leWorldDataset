name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Validate examples and compile tools
        run: make validate

      - name: Regenerate controlled experiment summary
        run: python tools/run_experiments.py

      - name: Regenerate uncertainty intervals
        run: python tools/experiment_statistics.py

      - name: Regenerate and validate experiment provenance
        run: python tools/experiment_manifest.py --strict

      - name: Audit citations and third-party assets
        run: |
          python tools/citation_source_audit.py --strict
          python tools/third_party_asset_audit.py --strict

      - name: Regenerate paper values
        run: python tools/paper_experiment_values.py

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Check public maturity language
        run: python tools/public_maturity_audit.py --strict

      - name: Smoke-test wheel install
        run: python tools/package_install_smoke.py --strict

      - name: Build and verify submission artifacts
        run: make readiness

      - name: Validate final generated state
        run: make validate

      - name: Check generated artifact freshness
        run: python tools/artifact_freshness.py --strict
